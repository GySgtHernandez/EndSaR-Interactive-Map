name: Validate map data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed map data
        run: python scripts/validate_map_data.py site/data/map-data.json --baseline tests/baseline-summary.json --allow-change --report build/ci-validation-report.json
